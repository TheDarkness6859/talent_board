<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Update Interview Result</title>
</head>
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0">Update Interview Result</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/interviews/{id}/update-result(id=${interview.id})}" method="post">
                        <div class="mb-3">
                            <label for="result" class="form-label">Result</label>
                            <select class="form-select" id="result" name="result" required>
                                <option value="">Select Result</option>
                                <option value="PENDING">Pending</option>
                                <option value="PASSED">Passed</option>
                                <option value="FAILED">Failed</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea class="form-control" id="notes" name="notes" rows="5" placeholder="Add detailed feedback about the interview..."></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Update Result</button>
                            <a th:href="@{/interviews/{id}(id=${interview.id})}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
