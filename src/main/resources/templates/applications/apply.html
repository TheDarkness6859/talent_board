<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Apply for Vacancy</title>
</head>
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0">Apply for Vacancy</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/applications/vacancy/{vacancyId}/apply(vacancyId=${vacancyId})}" method="post">
                        <div class="mb-3">
                            <label for="notes" class="form-label">Cover Letter / Notes</label>
                            <textarea class="form-control" id="notes" name="notes" rows="5" placeholder="Tell us why you're interested in this position..."></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Submit Application</button>
                            <a th:href="@{/vacancies/{id}(id=${vacancyId})}" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
