<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Application Details</title>
</head>
<body>
<section>
    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h3 class="mb-0">Application Details</h3>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <h5 class="fw-bold">Candidate</h5>
                        <p th:text="${application.candidate.fullName}"></p>
                        <p class="text-muted" th:text="${application.candidate.email}"></p>
                    </div>
                    <div class="mb-3">
                        <h5 class="fw-bold">Vacancy</h5>
                        <p th:text="${application.vacancy.title}"></p>
                        <a th:href="@{/vacancies/{id}(id=${application.vacancy.id})}" class="btn btn-sm btn-outline-primary">View Vacancy</a>
                    </div>
                    <div class="mb-3">
                        <h5 class="fw-bold">Applied Date</h5>
                        <p th:text="${#temporals.format(application.applicationDate, 'yyyy-MM-dd HH:mm')}"></p>
                    </div>
                    <div class="mb-3">
                        <h5 class="fw-bold">Status</h5>
                        <span class="status-badge" 
                              th:class="'status-badge status-' + ${application.state.toString().toLowerCase().replace('_', '-')}"
                              th:text="${application.state}"></span>
                    </div>
                    <div class="mb-3" th:if="${application.notes}">
                        <h5 class="fw-bold">Cover Letter / Notes</h5>
                        <p th:text="${application.notes}"></p>
                    </div>
                </div>
                <div class="card-footer">
                    <a th:href="@{/applications/{id}/update-status(id=${application.id})}" class="btn btn-warning" sec:authorize="hasAnyRole('ADMIN', 'RECRUITER')">Update Status</a>
                    <a th:href="@{/interviews/application/{applicationId}(applicationId=${application.id})}" class="btn btn-info" sec:authorize="hasAnyRole('ADMIN', 'RECRUITER')">View Interviews</a>
                    <a th:href="@{/applications/my}" class="btn btn-secondary">Back to My Applications</a>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
